name: otaqu
description: Created by Dani Rycki Dinata
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.7
  dartz: ^0.10.1
  bottom_navy_bar: ^6.1.0
  animations: ^2.0.3

  # Common packages
  nb_utils: ^6.0.0
  google_fonts: ^5.1.0
  lottie: ^2.4.0

  # State Management Technique
  bloc: ^8.1.0
  flutter_bloc: ^8.1.1

  # Singleton instance
  get_it: ^7.2.0

  # Network Stuff
  dio: ^5.3.2
  equatable: ^2.0.5
  internet_connection_checker: ^1.0.0+1
  json_serializable: ^6.5.4
  jwt_decoder: ^2.0.1
  html: ^0.15.4

  # Persistance Data
  shared_preferences: ^2.0.15
  sqflite: ^2.2.2

  # Used for image save and pick
  image_picker: ^1.0.2
  path_provider: ^2.0.15
  cached_network_image: ^3.2.3
  permission_handler: ^11.0.0
  screenshot: ^2.1.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

# win32 <5.5.4 uses UnmodifiableUint8ListView, removed in Dart 3.9. Pin a
# compatible 5.x (accepted by all its consumers) so the transitive dep builds.
# flutter_plugin_android_lifecycle <2.0.16 uses the removed v1 Android embedding
# (PluginRegistry.Registrar); pin a v2-only release so its Java compiles.
dependency_overrides:
  win32: ^5.5.4
  flutter_plugin_android_lifecycle: ^2.0.17

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/icons/
